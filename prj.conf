CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_SERIAL=y
# US-100 replies are received in the UART interrupt
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_DISPLAY=y

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# cosf/sinf in the UI run on the hardware FPU
CONFIG_FPU=y

# LVGL renders from main, which needs more stack than before
CONFIG_MAIN_STACK_SIZE=6144
# Lower priority than the radar thread (5), so rendering never holds up the servo
CONFIG_MAIN_THREAD_PRIORITY=7

# LVGL: partial draw buffer of 10% of the screen (~11.5 KB),
# small object pool because the radar is drawn by one callback
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_32=y

# Debugging: print driver/LVGL init errors and catch failed asserts
CONFIG_LOG=y
CONFIG_ASSERT=y